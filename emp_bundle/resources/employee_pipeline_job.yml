resources:
  jobs:

    employee_attrition_job:

      name: "[${bundle.target}] Employee Attrition Pipeline"

      # ==================================================
      # SERVERLESS ENVIRONMENT
      # ==================================================

      environments:

        - environment_key: default

          spec:
            environment_version: "2"


      # ==================================================
      # TASKS
      # ==================================================

      tasks:

        # ================================================
        # TASK 1 — BRONZE
        # ================================================

        - task_key: bronze_ingestion

          environment_key: default

          spark_python_task:
            python_file: ../src/employee_bronze.py


        # ================================================
        # TASK 2 — SILVER + DATA QUALITY
        # ================================================

        - task_key: silver_clean_validate

          depends_on:

            - task_key: bronze_ingestion

          environment_key: default

          spark_python_task:
            python_file: ../src/employee_silver.py


        # ================================================
        # TASK 3 — GOLD
        # ================================================

        - task_key: gold_attrition_analytics

          depends_on:

            - task_key: silver_clean_validate

          environment_key: default

          spark_python_task:
            python_file: ../src/employee_gold.py